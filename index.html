<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rodízio Automático: Organistas CCB</title>
<style>
:root{--bg:#e8f4ee;--card:#fbfefc;color-scheme:light;--tx:#1f1d1a;--mut:#6b675f;--bd:#d9d6cd;--ac:#a9d8c4;--act:#173028;--ac2:#5f8f7d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:120px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dias{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.hint{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{padding:10px 18px;border-radius:8px;border:1px solid var(--ac2);background:var(--ac);color:var(--act);font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border-color:var(--ac2)}
.logo{display:block;width:180px;max-width:60%;height:auto;margin:0 auto 14px;border-radius:6px}
h1,.sub{text-align:center}
button:disabled{opacity:.45;cursor:not-allowed}
.err{color:#b3261e;margin-top:10px;font-weight:600}
.wrap{overflow-x:auto;max-height:420px;overflow-y:auto;border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{position:sticky;top:0;background:var(--card)}
</style>
</head>

    <div><label for="ano">Ano</label><input id="ano" type="number" min="1" value="2026"></div>
  </div>
  <div class="dias" id="dias"></div>
  <p class="hint">A ordem dos dias importa: ela define como o rodízio gira entre as organistas.</p>
</div>

<div class="card">
  <label for="org">Organistas (uma por linha)</label>
  <textarea id="org" placeholder="Maria&#10;Ana&#10;Joana"></textarea>
</div>

<div class="btns">
  <button id="gerar">Gerar rodízio</button>
  <button id="baixar" class="sec" disabled>Download do rodízio</button>
</div>
<div id="msg" class="err" role="alert"></div>

<div class="card" id="prev" style="display:none;margin-top:16px">
  <div class="wrap"><table><thead><tr><th>Dia</th><th>Data</th><th>Organista</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
</main>

<script>
const NOMES = ["DOM","SEG","TER","QUA","QUI","SEX","SAB"];
let csv = "";

const $ = id => document.getElementById(id);
const mod = (a, n) => ((a % n) + n) % n;
const bissexto = a => (a % 400 === 0) || (a % 4 === 0 && a % 100 !== 0);

// dia da semana de 1º de janeiro (0 = DOM)
const anoInicio = a => (a + Math.floor((a-1)/4) - Math.floor((a-1)/100) + Math.floor((a-1)/400)) % 7;
// dia da semana do dia N do ano (N começa em 1)
const diaAtual = (dia, ano) => (anoInicio(ano) + dia - 1) % 7;

function dataDoDia(dia, ano) {
  const feb = bissexto(ano) ? 29 : 28;
  const meses = [31, feb, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let mes = 0;
  while (mes < 11 && dia > meses[mes]) { dia -= meses[mes]; mes++; }
  return String(dia).padStart(2,"0") + "/" + String(mes+1).padStart(2,"0") + "/" + ano;
}

function montarSelects() {
  const n = Math.min(7, Math.max(1, parseInt($("nd").value) || 1));
  const box = $("dias");
  const atuais = [...box.querySelectorAll("select")].map(s => s.value);
  box.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const w = document.createElement("div");
    const l = document.createElement("label");
    l.textContent = "Dia " + (i + 1);
    const s = document.createElement("select");
    s.setAttribute("aria-label", "Dia " + (i + 1));
    NOMES.forEach((d, k) => s.add(new Option(d, k)));
    s.value = atuais[i] !== undefined ? atuais[i] : String(i === 0 ? 0 : Math.min(6, i * 3));
    w.append(l, s);
    box.append(w);
  }
}

const csvCell = t => /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;

function gerar() {
  $("msg").textContent = "";
  const vet = [...$("dias").querySelectorAll("select")].map(s => parseInt(s.value));
  const nomes = $("org").value.split("\n").map(s => s.trim()).filter(Boolean);
  const ano = parseInt($("ano").value);
  const dias = vet.length;

  if (!nomes.length) return erro("Informe ao menos uma organista.");
  if (!ano || ano < 1) return erro("Informe um ano válido.");

  const org = nomes.length;
  const passo = Math.max(1, Math.floor(org / dias));
  const max = bissexto(ano) ? 366 : 365;
  const linhas = [];
  let dia = 0, fim = false;

  while (!fim && dia <= max) {
    for (let i = 0; i < org && !fim; i++) {
      for (let j = 0; j < dias; j++) {
        dia++;
        while (diaAtual(dia, ano) !== vet[j]) dia++;
        if (dia > max) { fim = true; break; }
        linhas.push([NOMES[vet[j]], dataDoDia(dia, ano), nomes[mod(i - passo * j, org)]]);
      }
    }
  }

  csv = "Dia,Data,Organista\n" + linhas.map(l => l.map(csvCell).join(",")).join("\n") + "\n";

  const tb = $("tb");
  tb.innerHTML = "";
  linhas.forEach(l => {
    const tr = document.createElement("tr");
    l.forEach(c => { const td = document.createElement("td"); td.textContent = c; tr.append(td); });
    tb.append(tr);
  });
  $("prev").style.display = "block";
  $("baixar").disabled = false;
}

function erro(t) { $("msg").textContent = t; }

async function baixar() {
  if (!csv) return;
  const dados = "\uFEFF" + csv; // BOM para o Excel abrir os acentos corretamente
  const ano = $("ano").value;
  const nome = "rodizio-" + ano + ".csv";
  try {
    const dl = window.claude && await window.claude.use("downloads");
    if (dl) { await dl.save({ filename: nome, data: dados }); return; }
  } catch (e) {
    if (e && e.code === "declined") return;
  }
  // alternativa quando a página é aberta como arquivo local
  const url = URL.createObjectURL(new Blob([dados], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = nome;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

$("ano").value = new Date().getFullYear();
$("nd").addEventListener("input", montarSelects);
$("gerar").addEventListener("click", gerar);
$("baixar").addEventListener("click", baixar);
montarSelects();
</script>
</body>
</html>
